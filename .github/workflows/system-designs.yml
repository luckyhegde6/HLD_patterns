name: System design docs and Archify exports

on:
  pull_request:
    paths:
      - "system_designs/**"
      - "scripts/validate-system-designs.mjs"
      - ".github/workflows/system-designs.yml"
  push:
    branches: [main]
    paths:
      - "system_designs/**"
      - "scripts/validate-system-designs.mjs"
      - ".github/workflows/system-designs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: system-designs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate source structure and documentation
        run: node scripts/validate-system-designs.mjs

      - name: Provision Chrome for Archify browser validation
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Install Archify CLI source (pinned release)
        run: |
          git clone --depth 1 --branch v3.2.0 https://github.com/tt-a1i/archify.git .archify-cli
          npm ci --prefix .archify-cli/archify
          node .archify-cli/archify/bin/archify.mjs doctor

      - name: Generate and finalize all interactive HTML exports
        shell: bash
        env:
          ARCHIFY_CHROME: ${{ steps.chrome.outputs.chrome-path }}
          ARCHIFY_CHROME_NO_SANDBOX: "1"
        run: |
          set -euo pipefail
          mkdir -p dist/archify
          count=0
          failures=0
          failed_designs=()
          while IFS= read -r spec; do
            slug="$(basename "$spec" .architecture.json)"
            out="dist/archify/${slug}.architecture.html"
            echo "::group::Archify finalize: ${slug}"
            if node .archify-cli/archify/bin/archify.mjs finalize architecture "$spec" "$out" --quality showcase --json; then
              if test -s "$out"; then
                count=$((count + 1))
              else
                echo "::error::Finalize returned success but HTML output is missing for ${slug}"
                failures=$((failures + 1))
                failed_designs+=("$slug: missing HTML after successful finalize")
              fi
            else
              failures=$((failures + 1))
              failed_designs+=("$slug: finalize failed; inspect the JSON diagnostics above")
            fi
            echo "::endgroup::"
          done < <(find system_designs -type f -path "*/archify/*.architecture.json" | sort)
          if test "$count" -ne 17; then
            echo "::error::Expected 17 successful HTML exports; got ${count}"
            failures=$((failures + 1))
          fi
          if test "$failures" -gt 0; then
            printf '::error::Archify failed for %s design(s):\n' "$failures"
            printf ' - %s\n' "${failed_designs[@]}"
            exit 1
          fi
          echo "Successfully finalized all ${count} interactive Archify HTML exports."

      - name: Upload interactive HTML exports and validation receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archify-interactive-html-and-receipts
          path: dist/archify/
          if-no-files-found: error
          retention-days: 30
