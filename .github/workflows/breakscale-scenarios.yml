name: Breakscale scenario manifests

on:
  pull_request:
    paths:
      - "breakscale/**"
      - "system_designs/**"
      - ".github/workflows/breakscale-scenarios.yml"
  push:
    branches: [main]
    paths:
      - "breakscale/**"
      - ".github/workflows/breakscale-scenarios.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Validate Breakscale scenario provenance
        run: node breakscale/scripts/validate-scenarios.mjs
